<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRS TECH — Developer Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#f4f7ff;font-family:Arial,sans-serif;padding:20px}
.card{width:min(100%,430px);padding:28px;background:#122238;border:1px solid #30445f;border-radius:20px;box-shadow:0 20px 60px #0005}
h1,h2{margin-top:0}
p{color:#bdcadd;line-height:1.5}
label{display:block;margin:15px 0 7px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #405674;background:#091525;color:white}
button{width:100%;padding:13px;margin-top:16px;border:0;border-radius:9px;background:#1685e5;color:white;font-weight:bold;cursor:pointer}
.link{display:block;text-align:center;margin-top:18px;color:#80c5ff;cursor:pointer;text-decoration:underline}
.hidden{display:none!important}
#msg{overflow-wrap:anywhere;color:#ffd0a8}
.qr{display:block;width:min(100%,260px);margin:18px auto;background:white;padding:10px;border-radius:12px}
.note{font-size:12px;color:#9db0c8}
video{width:100%;margin-top:14px;border-radius:10px}
</style>
</head>
<body>
<main class="card">

<section id="login">
<h1>🛡️ SRS TECH</h1>
<p>Developer Access — sign in to open your dashboard.</p>
<form id="form">
<label for="user">Username</label>
<input id="user" autocomplete="username" required>
<label for="pass">Password</label>
<input id="pass" type="password" autocomplete="current-password" required>
<button type="submit">Login</button>
</form>
<a class="link" href="#register" id="create">Create an account</a>
<p class="note">Temporary local demo. Not production authentication.</p>
</section>

<section id="register" class="hidden">
<h2>📝 Create an account</h2>
<p>Scan a QR code using your device camera.</p>
<button type="button" id="scan">Scan QR using this device</button>
<video id="video" class="hidden" playsinline></video>
<p id="msg" role="status"></p>
<a class="link" href="#" id="back">← Back to Login</a>
<p class="note">Point your camera at a QR code. Only trusted QR links should be opened.</p>
</section>

</main>
<script>
const login=document.getElementById('login');
const reg=document.getElementById('register');
const msg=document.getElementById('msg');
const video=document.getElementById('video');
let stream=null,active=false;

document.getElementById('create').addEventListener('click',e=>{
 e.preventDefault();
 login.classList.add('hidden');
 reg.classList.remove('hidden');
 msg.textContent='';
});

function stopCamera(){
 active=false;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 video.srcObject=null;
 video.classList.add('hidden');
}

document.getElementById('back').addEventListener('click',e=>{
 e.preventDefault();
 stopCamera();
 reg.classList.add('hidden');
 login.classList.remove('hidden');
});

document.getElementById('scan').addEventListener('click',async()=>{
 if(!('BarcodeDetector' in window)){
  msg.textContent='Camera QR scanning is not supported in this browser. Scan the displayed QR with another phone.';
  return;
 }
 try{
  const detector=new BarcodeDetector({formats:['qr_code']});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  video.srcObject=stream;
  video.classList.remove('hidden');
  await video.play();
  active=true;
  async function tick(){
   if(!active)return;
   try{
    const codes=await detector.detect(video);
    if(codes.length){
     const u=new URL(codes[0].rawValue,location.href);
     if(['http:','https:'].includes(u.protocol)){
      stopCamera();
      location.href=u.href;
      return;
     }
    }
   }catch(e){}
   if(active)setTimeout(tick,250);
  }
  tick();
 }catch(e){
  msg.textContent='Camera unavailable. Allow camera permission or scan the QR with your phone camera.';
 }
});

document.getElementById('form').addEventListener('submit',e=>{
 e.preventDefault();
 const u=document.getElementById('user').value.trim();
 const p=document.getElementById('pass').value;
 if(u==='srstech'&&p==='SrsTech@2026'){
  sessionStorage.setItem('srstech_demo_session','active');
  location.href='app.html';
 }else{
  alert('Incorrect temporary demo credentials.');
 }
});
</script>
</body>
</html>
